version: '3.8'

services:
  react-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - mock-backend

  mock-backend:
    image: node:20-alpine
    command: sh -c "echo 'Mock backend active' && sleep 3600"
    ports:
      - "3000:3000"
