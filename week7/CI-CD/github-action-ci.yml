name: Java & React FSE CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-java:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compile and Test Week 2 Java Services
        run: |
          mvn clean test -f "week2/Spring Core and Maven/LibraryManagement/pom.xml"
          mvn clean test -f "week2/Spring Data JPA/EmployeeManagementSystem/pom.xml"

      - name: Compile and Test Week 3 REST Service
        run: mvn clean test -f "week3/Spring REST/spring-rest-service/pom.xml"

  build-react:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'week5/package-lock.json'

      - name: Install and Test Week 5 React App
        run: |
          cd week5
          npm ci
          npm run test
          npm run build

      - name: Install and Test Week 6 React App
        run: |
          cd ../week6
          npm ci
          npm run test
          npm run build
